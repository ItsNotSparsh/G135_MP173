# MP173 findings --- fill in every value, keep every key.
# The marking tool reads this file. Write null only where the comment says so.
# Use the exact column names and group values from your data files.

group_id: "G135"          # your group id, e.g. "G042"
problem_id: "MP173"

data_issues:
  # For each of the 7 kinds: present: true or false.
  # If present is false, leave the other values as null.
  leaking_column:
    present: true
    column: spoilage_found_at_unloading           # the column that must not be used as a feature
  unit_mixup:
    present: true
    column: power_cuts_hours           # the column recorded in a different unit
    group_value: Chamber 1      # the value of chamber whose rows are affected
    factor: 60           # wrong value = right value x factor
  sentinel_value:
    present: false
    column: null
    value: null            # the special number typed instead of a blank
    count: null            # how many rows have it
  duplicate_rows:
    present: true
    count: 43            # number of EXTRA copies (rows you would delete)
  stuck_sensor:
    present: false
    column: null
    start_date: null       # first date with the stuck value, YYYY-MM-DD
    end_date: null         # last date with the stuck value, YYYY-MM-DD
  target_typos:
    present: false
    count: null            # rows whose target was typed 10 times too big
  spelling_variants:
    present: false        
    column: null
    true_levels: null      # how many real categories there are after cleaning

tracking:
  experiment_name: "MP173-cold-storage-spoilage"
  best_run_id: "00b30540357a40149c10041a8c5af335"  # the MLflow run id of your v1 model
  registered_model_name: "MP173-spoilage-model"
  champion_version: 2

monitoring:
  psi:                     # cleaned train.csv vs later.csv, 10 bins
    storage_days: 0.043916
    temp_set_c: 0.036242
    humidity_pct: 0.038834
    power_cuts_hours: 0.025110
    bag_weight_kg: 5.538988
    door_openings_per_day: 0.058773
  most_drifted_feature: bag_weight_kg
  mae_by_group:            # v1 on later.csv, per value of chamber
    'Chamber 1': 1.677319
    'Chamber 2': 2.540590
    'Chamber 3': 1.752731
  worst_served_group: 'Chamber 2'
  mae_v1_on_check: 2.040886    # v1 on the last 30% of later.csv (by date)
  mae_v2_on_check: 0.936457    # v2 on the same rows
  decision: promote           # promote or keep
